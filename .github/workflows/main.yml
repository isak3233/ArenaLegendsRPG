name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: 
jobs:
  get-user-info:
    name: Get user information
    runs-on: ubuntu-latest
    steps:
      - name: User information
        env:
          STARTED_BY: ${{github.actor}}
          EVENT: ${{github.event_name}}
          BRANCH: ${{github.ref_name}}
        run: |
          echo "### Started by $STARTED_BY — event: $EVENT — branch: $BRANCH" >> $GITHUB_STEP_SUMMARY
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIGURATION: Release
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build 
        run: dotnet build --no-restore --configuration ${{env.BUILD_CONFIGURATION}}
      - name: Test
        run : dotnet test --no-build --configuration ${{env.BUILD_CONFIGURATION}}
  formatering:
    name: Code format check
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Format Code
        run: |
          dotnet format --verify-no-changes
  pr-size:
    name: PR size recommendation
    runs-on: ubuntu-latest
    #RUNS ONLY ON PRS
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Label PR by size
        uses: pascalgn/size-label-action@v0.5.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sizes: >
            {
              "0": "XS",
              "200": "S",
              "500": "M",
              "800": "L",
              "1000": "XL",
              "3000": "XXL"
            }
      
      - name: Recommend PR size
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.issue.number;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100
              }
            );

            const fileCount = files.length;
            const added = files.reduce(
              (sum, file) => sum + file.additions, 0
            );
            const deleted = files.reduce(
              (sum, file) => sum + file.deletions, 0
            );
            const changedLines = added + deleted;

            let recommendation = "PR size looks okat.";

            if (fileCount >= 10 && changedLines >= 1000) {
              recommendation = "Consider splitting this PR. It exceeds both size thresholds.";
            } else if (fileCount >= 10) {
              recommendation = "Consider splitting this PR if the changes cover many tasks.";
            } else if (changedLines >= 1000) {
              recommendation = "Consider splitting this PR if the changes can be reviewed independently.";
            }

            const marker = "<!-- pr-size-recommendation -->";

            const body = `## PR Size Recommendation

            Changed Files: ${fileCount}
            Added Lines: ${added}
            Deleted Lines: ${deleted}
            Total Changed Lines: ${changedLines}
            
            ${recommendation}
            
            _Automatically generated by GitHub Actions._`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: pullNumber,
                per_page: 100
              }
            );

            const existing = comments.find(comment =>
              comment.user?.type === "Bot" &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body
              });
            }



          

        
          
      
    
